name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile Montoya extension
        run: mvn --batch-mode --file burp-extension/pom.xml clean package

      - name: Validate Python
        run: python3 -m py_compile agent/run.py

      - name: Validate shell
        run: bash -n build.sh master.sh start_pipeline.sh stop.sh burp/start-burp.sh

      - name: Validate JSON
        run: |
          python3 -m json.tool burp/project-options.json >/dev/null
          python3 -m json.tool burp/user-options.json >/dev/null
