name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile Montoya extension
        run: mvn --batch-mode --file burp-extension/pom.xml clean package

      - name: Validate shell
        run: bash -n build.sh

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet
