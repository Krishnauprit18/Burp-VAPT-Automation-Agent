services:
  ofbiz:
    build:
      context: ${OFBIZ_SOURCE}
      target: demo
    container_name: ofbiz-burp-agent-target
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ofbiz-runtime:/ofbiz/runtime
    restart: unless-stopped

volumes:
  ofbiz-runtime:
    name: ofbiz-burp-agent-runtime
